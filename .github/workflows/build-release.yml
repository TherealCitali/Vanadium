name: Build Signed Release (arm64-v8a)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build Signed arm64-v8a Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Decode Keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > ./vanadium.keystore
          elif [ -f ./vanadium.keystore ]; then
            echo "Using existing repository keystore"
          else
            echo "No keystore available" >&2
            exit 1
          fi

      - name: Sign and Package arm64-v8a Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p release-apks
          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name "apksigner" | sort -V | tail -n 1)
          
          if [ -d "out/Default/apks" ]; then
            for apk in out/Default/apks/*arm64*.apk out/Default/apks/Trichrome*.apk; do
              if [ -f "$apk" ]; then
                echo "Signing $apk with $APKSIGNER..."
                "$APKSIGNER" sign --ks ./vanadium.keystore \
                  --ks-pass "pass:${KEYSTORE_PASSWORD:-VanadiumRelease2026}" \
                  --ks-key-alias "${KEY_ALIAS:-vanadium}" \
                  --key-pass "pass:${KEY_PASSWORD:-VanadiumRelease2026}" \
                  --out "release-apks/$(basename "$apk")" "$apk" || cp "$apk" "release-apks/"
              fi
            done
          fi

      - name: Upload arm64-v8a Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vanadium-release-arm64-v8a
          path: |
            release-apks/*.apk
            vanadium.keystore
          if-no-files-found: ignore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: release-apks/*.apk
          token: ${{ secrets.MY_PAT_TOKEN || secrets.GITHUB_TOKEN }}
