name: Build Signed Release (arm64-v8a)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build Signed arm64-v8a Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/local/lib/node_modules
          sudo docker image prune --all --force || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Decode Keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > ./vanadium.keystore
          elif [ -f ./vanadium.keystore ]; then
            echo "Using existing repository keystore"
          else
            echo "No keystore available" >&2
            exit 1
          fi

      - name: Install Build Dependencies & Depot Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y generate-ninja ninja-build python3-pip
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH
          export PATH="$HOME/depot_tools:$PATH"
          $HOME/depot_tools/update_depot_tools || true

      - name: Fetch Chromium Source & Apply Vanadium Patches
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          
          echo "Running gclient sync to fetch Chromium 153.0.8010.52 and subprojects..."
          gclient sync --no-history --shallow --nohooks
          
          if [ -d "src" ]; then
            cd src
            echo "Applying Vanadium main patches..."
            for patch in $(ls $GITHUB_WORKSPACE/patches/*.patch | sort); do
              echo "Applying $patch..."
              git apply "$patch" || patch -p1 < "$patch" || exit 1
            done
            
            cd $GITHUB_WORKSPACE
            echo "Running gclient hooks (downloading filter lists, applying subproject patches)..."
            gclient runhooks || true
            
            cd src
            mkdir -p out/Default
            cp $GITHUB_WORKSPACE/args.gn out/Default/args.gn
            
            echo "Generating GN build files..."
            gn gen out/Default
          else
            echo "Error: Chromium src directory not found after gclient sync" >&2
            exit 1
          fi

      - name: Build arm64-v8a Release Targets
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          if [ -d "src/out/Default" ]; then
            cd src
            if command -v autoninja &> /dev/null; then
              autoninja -C out/Default TrichromeChrome64 || ninja -C out/Default TrichromeChrome64
            else
              ninja -C out/Default TrichromeChrome64
            fi
          fi

      - name: Sign and Package arm64-v8a Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p release-apks
          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name "apksigner" | sort -V | tail -n 1)
          
          # Collect built APK files from out/Default/apks or out/Default
          shopt -s nullglob
          for apk in src/out/Default/apks/*.apk src/out/Default/*.apk out/Default/apks/*.apk; do
            if [ -f "$apk" ]; then
              echo "Signing $apk with $APKSIGNER..."
              "$APKSIGNER" sign --ks ./vanadium.keystore \
                --ks-pass "pass:${KEYSTORE_PASSWORD:-VanadiumRelease2026}" \
                --ks-key-alias "${KEY_ALIAS:-vanadium}" \
                --key-pass "pass:${KEY_PASSWORD:-VanadiumRelease2026}" \
                --out "release-apks/$(basename "$apk")" "$apk" || cp "$apk" "release-apks/"
            fi
          done

      - name: Upload arm64-v8a Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vanadium-release-arm64-v8a
          path: |
            release-apks/*.apk
            vanadium.keystore
          if-no-files-found: warn
